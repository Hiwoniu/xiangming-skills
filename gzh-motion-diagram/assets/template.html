<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 【改这里】标题 -->
<title>向明图解 NN · 名称</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* ===================== 规范区：不要改 ===================== */
  @font-face { font-family: "PingFang SC"; src: local("PingFang SC"), local("PingFangSC-Regular"); font-weight: 400; }
  @font-face { font-family: "PingFang SC"; src: local("PingFangSC-Semibold"); font-weight: 600 900; }
  @font-face { font-family: "Hiragino Sans GB"; src: local("Hiragino Sans GB"); }
  @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"); }
  :root {
    --bg: #F6F4EE; --card: #FFFDF8; --ink: #1F2328; --muted: #5B616B; --line: #D8D3C7;
    --track: #ECE7DC; --well: #F3EEE3; --dotc: #DDD7C9;
    --accent: #E8590C;
    --bad: #C92A2A; --bad-bg: #F8E1E1; --good: #2B8A3E; --good-bg: #E3F1E6;
    --im: #2F6FEB; --gh: #2D333B; --ci: #9C6B00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 900px; background: var(--bg); overflow: hidden; }
  body { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; color: var(--ink); }
  #root { position: relative; width: 1080px; height: 900px; overflow: hidden; background: var(--bg); }

  .bg-dots { position: absolute; inset: -40px; background-image: radial-gradient(circle, var(--dotc) 1.6px, transparent 1.7px); background-size: 36px 36px; opacity: .55; }
  .bg-ghost { position: absolute; right: -40px; bottom: 120px; font: 900 190px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: -6px; color: var(--ink); opacity: .035; white-space: nowrap; }
  .bg-glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(232,89,12,.10), rgba(232,89,12,0) 65%); left: 520px; top: -260px; }
  .brand { position: absolute; right: 56px; top: 58px; font-size: 24px; color: var(--muted); letter-spacing: 1px; z-index: 5; }

  .scene { position: absolute; inset: 0; opacity: 0; }
  .scene-content { width: 100%; height: 100%; padding: 50px 56px 48px; display: flex; flex-direction: column; }
  .head { height: 170px; display: flex; flex-direction: column; gap: 12px; }
  .pill { align-self: flex-start; font-size: 24px; font-weight: 700; color: var(--accent); border: 2.5px solid var(--accent); border-radius: 999px; padding: 4px 18px; }
  .title { font-size: 54px; font-weight: 800; letter-spacing: -1px; line-height: 1.12; }
  .sub { font-size: 28px; color: var(--muted); line-height: 1.3; }
  .stage { position: relative; height: 520px; margin: 0 -56px; }
  .verdict { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .chip { font-size: 30px; font-weight: 700; padding: 10px 22px; border-radius: 14px; white-space: nowrap; }
  .chip.ok { color: var(--good); background: var(--good-bg); }
  .chip.no { color: var(--bad); background: var(--bad-bg); }

  /* 元件库（见 design-system.md 第 4 节） */
  .abs { position: absolute; left: 0; top: 0; }
  .bub { width: 80px; height: 50px; border-radius: 25px; color: #fff; font: 800 26px/50px "Helvetica Neue", Arial, sans-serif; text-align: center; box-shadow: 0 4px 10px rgba(31,35,40,.18); z-index: 4; }
  .bub.IM { background: var(--im); } .bub.PR { background: var(--gh); } .bub.CI { background: var(--ci); }
  .box { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; }
  .box.router { border-color: var(--accent); border-width: 4px; }
  .box.worker { padding: 12px 18px; display: flex; flex-direction: column; gap: 6px; }
  .w-name { font-size: 28px; font-weight: 800; line-height: 1.2; }
  .w-task { font-size: 24px; color: var(--muted); line-height: 1.2; }
  .lbl { font-size: 34px; font-weight: 800; }
  .small { font-size: 26px; color: var(--muted); }
  .bar { height: 14px; border-radius: 7px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left center; transform: scaleX(0); }
  .stripe { width: 24px; height: 64px; border-radius: 5px; transform-origin: bottom center; }
  .avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 50px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .reply { width: 132px; height: 48px; border-radius: 12px; background: var(--card); border: 2.5px solid var(--bad); color: var(--bad); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 6; }
  .good-reply { border: 3px solid var(--accent); border-radius: 18px; background: var(--card); font-size: 28px; font-weight: 700; padding: 0 22px; display: flex; align-items: center; }
  .dot { width: 18px; height: 18px; border-radius: 50%; z-index: 5; }
  .qmark { width: 44px; height: 44px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 30px; font-weight: 800; text-align: center; line-height: 44px; z-index: 5; }
  .mem-row { height: 46px; border-radius: 10px; background: var(--well); display: flex; align-items: center; gap: 8px; padding: 0 10px; }
  .mem-tag { font-size: 24px; font-weight: 700; color: #fff; padding: 2px 10px; border-radius: 8px; white-space: nowrap; }
  .mem-dot { width: 14px; height: 14px; border-radius: 50%; }
  .big-count { display: flex; align-items: baseline; gap: 12px; }
  .big-count b { font: 800 72px/1 "Helvetica Neue", Arial, sans-serif; color: var(--bad); font-variant-numeric: tabular-nums; }
  .note-bad { font-size: 30px; font-weight: 700; color: var(--bad); white-space: nowrap; }
  svg.wires { position: absolute; left: 0; top: 0; overflow: visible; }

  .sum { width: 100%; height: 100%; padding: 50px 56px 48px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .quote { font-size: 52px; font-weight: 800; line-height: 1.3; max-width: 900px; letter-spacing: -1px; }
  .quote em { font-style: normal; color: var(--accent); }
  .tbl { display: grid; grid-template-columns: 1fr 160px 160px; border-top: 3px solid var(--ink); }
  .tbl > div { font-size: 30px; padding: 16px 6px; border-bottom: 2px solid var(--line); }
  .tbl .th { font-weight: 800; color: var(--muted); font-size: 26px; }
  .tbl .c { text-align: center; font-weight: 800; }
  .tbl .y { color: var(--good); } .tbl .n { color: var(--bad); }
  .tbl .hl { font-weight: 800; color: var(--accent); }

  #wipe { position: absolute; inset: 0; background: var(--ink); z-index: 50; }

  /* ===================== 本图解专用：【改这里】只许追加，只用 token ===================== */
</style>
</head>
<body>
<!-- 【改这里】data-duration 必须等于脚本里的 DUR -->
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="900">
  <div class="bg-dots" data-layout-ignore></div>
  <div class="bg-glow" data-layout-ignore></div>
  <div class="bg-ghost" data-layout-ignore>SUPER-AGENT</div>
  <!-- 【改这里】水印：<署名> · <系列名>图解 NN（默认署名：向明） -->
  <div class="brand" data-layout-allow-occlusion>向明 · 系列名 图解 NN</div>

  <!-- ===================== 【改这里】场景 HTML ===================== -->
  <section class="scene" id="s1">
    <div class="scene-content">
      <div class="head">
        <div class="pill">方案 ①</div>
        <div class="title">标题不超过十七个字宽</div>
        <div class="sub">副标题一句话说清这一幕的矛盾</div>
      </div>
      <div class="stage" id="st1" data-layout-allow-overflow></div>
      <div class="verdict">
        <div class="chip ok">✓ 成立的点</div>
        <div class="chip no">✗ 不成立的点</div>
      </div>
    </div>
  </section>

  <!-- 总结页：必须是最后一个 section，带 summary class -->
  <section class="scene summary" id="s2">
    <div class="sum">
      <div class="pill">一句话</div>
      <div class="quote">金句不超过两行，最多两处<em>高亮</em>。</div>
    </div>
  </section>

  <div id="wipe"></div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  /* ===================== 【改这里】时长与切场时间表 ===================== */
  const DUR = 20;                              // = data-duration
  const SCENES = [["#s1", 0], ["#s2", 14]];    // [场景选择器, 开始秒]；总结页 ≥ 4 秒

  /* ===================== helper：不要改 ===================== */
  const C = { IM: "var(--im)", PR: "var(--gh)", CI: "var(--ci)" };
  function el(parent, cls, html, style) {
    const d = document.createElement("div");
    d.className = cls;
    if (html != null) d.innerHTML = html;
    if (style) Object.assign(d.style, style);
    parent.appendChild(d);
    return d;
  }
  function bubble(parent, kind, x, y) {
    const b = el(parent, "abs bub " + kind, kind);
    gsap.set(b, { x: x, y: y });
    return b;
  }
  function svg(parent) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "wires");
    s.setAttribute("width", "1080");
    s.setAttribute("height", "520");
    parent.appendChild(s);
    return s;
  }
  // dash=false：返回可画线的实线（tween strokeDashoffset → 0）；dash=true：静态虚线
  function line(s, x1, y1, x2, y2, color, dash) {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", x1); l.setAttribute("y1", y1);
    l.setAttribute("x2", x2); l.setAttribute("y2", y2);
    l.setAttribute("stroke", color); l.setAttribute("stroke-width", "4");
    l.setAttribute("stroke-linecap", "round");
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (dash) l.setAttribute("stroke-dasharray", "10 10");
    else { l.setAttribute("stroke-dasharray", len); l.setAttribute("stroke-dashoffset", len); }
    s.appendChild(l);
    return l;
  }
  // 计数器：points = [[秒, 值], ...]，任意 seek 都正确
  function counter(node, points, t0, t1) {
    const proxy = { p: 0 };
    tl.to(proxy, {
      p: 1, duration: t1 - t0, ease: "none",
      onUpdate: function () {
        const t = t0 + this.progress() * (t1 - t0);
        let v = points[0][1];
        for (const [pt, pv] of points) if (pt <= t) v = pv;
        node.textContent = v;
      }
    }, t0);
  }
  function header(scene, t) {
    const q = (s) => scene.querySelector(s);
    tl.from(q(".pill"), { x: -30, opacity: 0, duration: 0.45, ease: "power3.out" }, t);
    tl.from(q(".title"), { y: 36, opacity: 0, duration: 0.6, ease: "expo.out" }, t + 0.1);
    tl.from(q(".sub"), { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" }, t + 0.25);
  }
  function verdict(scene, t) {
    tl.from(scene.querySelectorAll(".chip"), { y: 24, scale: 0.92, opacity: 0, duration: 0.45, ease: "back.out(2)", stagger: 0.18 }, t);
  }
  // 切场：墨色擦除。背景层保持静止，不要给 .bg-* 加任何动画
  tl.set(SCENES[0][0], { opacity: 1 }, 0);
  tl.set("#wipe", { xPercent: -100 }, 0);
  for (let i = 1; i < SCENES.length; i++) {
    const [id, t] = SCENES[i];
    tl.fromTo("#wipe", { xPercent: -100 }, { xPercent: 0, duration: 0.32, ease: "power2.in", immediateRender: false }, t - 0.32);
    tl.set(SCENES[i - 1][0], { opacity: 0 }, t);
    tl.set(id, { opacity: 1 }, t);
    tl.to("#wipe", { xPercent: 100, duration: 0.36, ease: "power2.out" }, t + 0.02);
  }

  /* ===================== 【改这里】各场景动画 ===================== */
  (function () {
    const T = SCENES[0][1];
    const sc = document.querySelector("#s1");
    const st = document.getElementById("st1");
    header(sc, T + 0.15);
    const box = el(st, "abs box", null, { left: "640px", top: "40px", width: "380px", height: "300px" });
    el(box, "abs lbl", "Session", { left: "26px", top: "18px" });
    tl.from(box, { scale: 0.9, opacity: 0, duration: 0.6, ease: "back.out(1.6)" }, T + 0.4);
    const b = bubble(st, "IM", -120, 200);
    tl.to(b, { x: 790, y: 140, duration: 0.7, ease: "power3.out" }, T + 1.2);
    verdict(sc, T + 3);
  })();

  (function () {
    const T = SCENES[1][1];
    const sc = document.querySelector("#s2");
    tl.from(sc.querySelector(".pill"), { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, T + 0.35);
    tl.from(sc.querySelector(".quote"), { y: 40, opacity: 0, duration: 0.7, ease: "expo.out" }, T + 0.5);
  })();

  window.__timelines["main"] = tl;
})();
</script>
</div>
</body>
</html>
